name: build

# Construit le .exe Windows et l'APK Android a chaque push.
# Telechargeables dans l'onglet Actions > dernier run > Artifacts.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run precedent : plus de runs empiles qui se
# disputent le cache buildozer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------- tests
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (stdlib + couche native via faux SDK)
        run: python -m unittest discover -s . -p "test_*.py" -v

  # ------------------------------------------- bibliotheque Syro Android
  syro-android:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      built: ${{ steps.check.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: check
        name: SDK Korg present ?
        run: |
          if [ -f native/volcasample/syro/korg_syro_volcasample.c ]; then
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
            echo "SDK Korg absent"
          fi
      - uses: nttld/setup-ndk@v1
        if: steps.check.outputs.built == 'true'
        id: ndk
        with:
          ndk-version: r25c
      - name: Compiler libsyro.so (arm64-v8a et armeabi-v7a)
        if: steps.check.outputs.built == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S native -B "build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$abi" --config Release
            mkdir -p "native/prebuilt/android/$abi"
            cp "build-$abi"/libsyro.so "native/prebuilt/android/$abi/"
          done
          find native/prebuilt -name '*.so' -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.built == 'true'
        with:
          name: syro-android
          path: native/prebuilt/android

  # ------------------------------------------------------------ Windows
  windows-exe:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install kivy==2.3.0 pyinstaller==6.6.0
      - name: Compiler syro.dll (si le SDK Korg est present)
        shell: bash
        run: |
          if [ -f native/volcasample/syro/korg_syro_volcasample.c ]; then
            cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
            cmake --build native/build --config Release
            find native/build -name 'syro.dll' -exec cp {} native/ \;
          else
            echo "SDK Korg absent, envoi direct desactive dans ce build"
          fi
      - name: Build exe
        env:
          KIVY_WINDOW: mock
          KIVY_GL_BACKEND: mock
          KIVY_AUDIO: mock
          KIVY_NO_ARGS: 1
          KIVY_NO_CONSOLELOG: 1
        run: pyinstaller packaging/volca_gain.spec --noconfirm
      - name: Console seule (secours, sans Kivy)
        env:
          KIVY_WINDOW: mock
          KIVY_GL_BACKEND: mock
          KIVY_AUDIO: mock
        run: pyinstaller --onefile --name volca-gain-console cli.py --noconfirm
      - name: Joindre la DLL
        shell: bash
        run: |
          if [ -f native/syro.dll ]; then cp native/syro.dll dist/ || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: MOCTABASS-windows
          path: dist/*

  # ------------------------------------------------------------ Android
  # buildozer installe directement : les actions Docker toutes faites ne sont
  # plus maintenues. Premier build long (SDK/NDK telecharges), ensuite cache.
  android-apk:
    needs: [tests, syro-android]
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer libsyro.so
        if: needs.syro-android.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: syro-android
          path: native/prebuilt/android

      - name: Neutraliser add_libs si la lib est absente
        run: |
          if [ ! -f native/prebuilt/android/arm64-v8a/libsyro.so ]; then
            sed -i 's/^android.add_libs/# android.add_libs/' buildozer.spec
            echo "APK sans envoi direct"
          else
            ls -l native/prebuilt/android/*/libsyro.so
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependances systeme
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Installer buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer==1.5.0 "cython==0.29.36" virtualenv

      - name: Cache SDK / NDK / dependances
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        run: buildozer -v android debug

      - name: Lister le resultat
        run: ls -lh bin/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: MOCTABASS-android
          path: bin/*.apk

  # ------------------------------------------------------------ release
  # Se declenche uniquement sur un tag de version :
  #   git tag v1.0.0 && git push --tags
  # Publie l'APK et le .exe en telechargement direct, sans passer par
  # les Artifacts (qui expirent et obligent a dezipper).
  publier:
    needs: [windows-exe, android-apk]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MOCTABASS-android
          path: livraison
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: MOCTABASS-windows
          path: livraison/windows
        continue-on-error: true

      - name: Renommer proprement
        run: |
          cd livraison
          v="${GITHUB_REF_NAME}"
          for f in *.apk; do
            [ -e "$f" ] || continue
            mv "$f" "MOCTA-BASS-$v.apk"
          done
          if [ -d windows ]; then
            cd windows && zip -r "../MOCTA-BASS-$v-windows.zip" . && cd ..
            rm -rf windows
          fi
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: livraison/*
          generate_release_notes: true
          body: |
            # MOC'TA BASS ${{ github.ref_name }}

            Traitement du son, sequences **et** transfert direct pour la
            **Korg volca sample** et la **volca sample2**. Le librarian Korg
            devient inutile.

            ## Installation

            **Android** : telecharge le `.apk` ci-dessous et installe-le.
            Autorise les sources inconnues a la premiere installation.

            **Windows** : telecharge le `.zip`, decompresse, lance
            `MOC'TA BASS.exe`.

            ## Le probleme resolu

            Le librarian officiel plafonne LEVEL a 100 %, il ne peut que
            baisser le volume. Un sample trop faible reste trop faible. Ici,
            le traitement se fait AVANT le transfert. Sur un kick a
            -32,8 dB RMS : **+27 dB recuperes**, sans ecretage.

            ## Sept onglets

            | Onglet | Role |
            |---|---|
            | TRAIT. | traitement par lot d'un dossier, ecoute avant / apres |
            | SLOTS | les 100 ou 200 emplacements, envoi, kits, import Korg |
            | EDIT. | forme d'onde, decoupe, A/B, reglages fins |
            | PATT. | les 10 patterns, 16 pas, motions |
            | MORC. | enchainer des patterns, ecouter, exporter |
            | BIBLI. | reserve illimitee de patterns et de sons |
            | TUTO | 22 sections de documentation integree |

            ## Ce que ca fait

            - **Traitement** : passe-haut, transient shaper, compresseur,
              saturation, porte de bruit, limiteur, mise a niveau RMS ou
              LUFS. Six presets, onze reglages fins, presets personnalises.
            - **Editeur** : forme d'onde, decoupe calee sur les passages par
              zero, comparaison A/B, annulation sur douze niveaux.
            - **Slots** : 100 sur sample, 200 sur sample2. Renommage,
              rangement, remplissage automatique d'un dossier entier,
              optimisation memoire, egalisation du kit, envoi groupe.
            - **Patterns** : les 10 sequences de 16 pas au format Korg, avec
              les **motions** sur quatorze pistes. L'ecoute reproduit
              l'effet reel des potards de chaque partie, et le swing.
            - **Morceau** : enchainer des patterns en sections repetees,
              ecouter, exporter en un seul WAV ou **en pistes separees**.
            - **Bibliotheque** : une reserve sans limite de patterns et de
              sons, hors des 100 slots.
            - **Import des sauvegardes du librarian** (`.vlcspllib` et
              `.vlcsplpatt`) : sons, noms et placement restaures.
            - **Envoi direct** par SYNC IN, avec compte a rebours.
            - **Kits portables** pour changer de telephone ou partager.

            ## Brancher

            Cable jack 3,5 mm de la sortie casque vers **SYNC IN**, volume a
            fond, Bluetooth coupe, aucun egaliseur. L'envoi ecrase le slot
            de destination sans confirmation.

            ## Limites connues

            L'envoi s'appuie sur le Syro SDK de Korg, qui vise la volca
            sample premiere generation. Les patterns de sample2 sont lus et
            affiches, mais pas envoyables. Les emplacements au-dela de 99
            restent a confirmer sur machine reelle. L'ecoute est mono : le
            panoramique n'est pas simule.

            Code source, tutoriel integre et 274 tests :
            https://github.com/janintibo-art/volca-gain
