name: build

# Construit le .exe Windows et l'APK Android a chaque push.
# Telechargeables dans l'onglet Actions > dernier run > Artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------- tests
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Tests (stdlib + couche native via faux SDK)
        run: python -m unittest discover -s . -p "test_*.py" -v

  # ------------------------------------------- bibliotheque Syro Android
  syro-android:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.check.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: check
        name: SDK Korg present ?
        run: |
          if [ -f native/volcasample/syro/korg_syro_volcasample.c ]; then
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "built=false" >> $GITHUB_OUTPUT
            echo "SDK Korg absent : ajoute-le avec"
            echo "  git submodule add https://github.com/korginc/volcasample native/volcasample"
          fi
      - uses: nttld/setup-ndk@v1
        if: steps.check.outputs.built == 'true'
        id: ndk
        with:
          ndk-version: r25c
      - name: Compiler libsyro.so (arm64-v8a et armeabi-v7a)
        if: steps.check.outputs.built == 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S native -B "build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build-$abi" --config Release
            mkdir -p "native/prebuilt/android/$abi"
            cp "build-$abi"/libsyro.so "native/prebuilt/android/$abi/"
          done
          find native/prebuilt -name '*.so' -exec ls -l {} \;
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.built == 'true'
        with:
          name: syro-android
          path: native/prebuilt/android

  # ------------------------------------------------------------ Windows
  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          pip install kivy==2.3.0 pyinstaller==6.6.0
      - name: Compiler syro.dll (si le SDK Korg est present)
        shell: bash
        run: |
          if [ -f native/volcasample/syro/korg_syro_volcasample.c ]; then
            cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
            cmake --build native/build --config Release
            find native/build -name 'syro.dll' -exec cp {} native/ \;
          else
            echo "SDK Korg absent, envoi direct desactive dans ce build"
          fi
      - name: Build exe
        run: pyinstaller packaging/volca_gain.spec --noconfirm
      - name: Console seule (secours, sans Kivy)
        run: pyinstaller --onefile --name volca-gain-console cli.py --noconfirm
      - name: Joindre la DLL
        shell: bash
        run: |
          if [ -f native/syro.dll ]; then cp native/syro.dll dist/ || true; fi
      - uses: actions/upload-artifact@v4
        with:
          name: VolcaGain-windows
          path: dist/*

  # ------------------------------------------------------------ Android
  android-apk:
    needs: [tests, syro-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer libsyro.so
        if: needs.syro-android.outputs.built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: syro-android
          path: native/prebuilt/android
      - name: Neutraliser add_libs si la lib est absente
        run: |
          if [ ! -f native/prebuilt/android/arm64-v8a/libsyro.so ]; then
            sed -i 's/^android.add_libs/# android.add_libs/' buildozer.spec
            echo "APK sans envoi direct"
          fi
      - name: Build APK
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable
      - uses: actions/upload-artifact@v4
        with:
          name: VolcaGain-android
          path: ${{ steps.buildozer.outputs.filename }}
